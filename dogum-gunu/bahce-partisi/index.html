:root{
  --sky:#8FD0F5; --sky-deep:#4FA9E0;
  --grass:#7BC043; --grass-deep:#4E9A2E;
  --cream:#FFFDF6; --cream-2:#FFF4E2;
  --pink:#FF8FB8; --pink-deep:#E8558C;
  --sun:#FFC93C; --sun-deep:#F0A81E;
  --grape:#B98CE8;
  --ink:#3F4A33; --ink-soft:#6B7A5C;
  --ease:cubic-bezier(.22,.61,.36,1);
  --stage-max:520px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'KutlamaBody',-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  color:var(--ink);background:#0d1a22;-webkit-font-smoothing:antialiased}

.frame{position:fixed;inset:0;display:grid;place-items:center;
  background:radial-gradient(120% 90% at 50% 20%,#1a3240,#0b141b 85%)}
.stage{position:relative;width:min(100%,var(--stage-max),calc(100dvh*.5625));
  aspect-ratio:9/16;overflow:hidden;background:var(--sky);
  box-shadow:0 30px 90px rgba(0,0,0,.55)}
@media(min-width:600px){.stage{border-radius:18px}}

/* ═══ 3. REFERANS: ana arka plan — birebir kullanılır ═══ */
#bg{position:absolute;inset:0;z-index:0;
  background-image:url("assets/arka-plan.webp");
  background-size:cover;background-position:center center;background-repeat:no-repeat;
  transform:scale(1.045);animation:sway 14s ease-in-out infinite;will-change:transform}
@keyframes sway{
  0%,100%{transform:scale(1.045) translate3d(0,0,0)}
  50%    {transform:scale(1.065) translate3d(0,-1.1%,0)}
}
#confetti{position:absolute;inset:0;z-index:1;pointer-events:none}

/* ═══ ekranlar ═══ */
.screen{position:absolute;inset:0;opacity:0;visibility:hidden;
  transition:opacity .8s var(--ease),visibility .8s}
.screen.on{opacity:1;visibility:visible}
#cover,#intro{z-index:30;background:transparent}
#cover video,#intro video{position:absolute;inset:0;width:100%;height:100%;
  object-fit:cover;display:block;background:var(--sky)}

/* dokun-ipucu (otomatik oynatma engellenirse) */
.tap{position:absolute;inset:0;z-index:32;display:none;place-items:center;cursor:pointer;
  background:radial-gradient(120% 80% at 50% 45%,rgba(255,255,255,.14),rgba(10,26,34,.55))}
.tap.on{display:grid}
.tap b{font-family:'Kutlama',system-ui;font-weight:600;font-size:clamp(19px,5.4vw,26px);
  color:#fff;letter-spacing:.02em;text-shadow:0 3px 18px rgba(0,20,40,.6);
  padding:14px 26px;border-radius:999px;background:rgba(255,255,255,.16);
  border:1.5px solid rgba(255,255,255,.5);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.05);opacity:1}}

.skip{position:absolute;right:14px;bottom:14px;z-index:33;
  font:inherit;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#fff;
  background:rgba(12,30,40,.42);border:1px solid rgba(255,255,255,.42);
  padding:9px 16px;border-radius:999px;cursor:pointer;opacity:0;pointer-events:none;
  transition:opacity .5s ease;backdrop-filter:none}
.skip.on{opacity:1;pointer-events:auto}

/* ═══ ana davetiye ═══ */
#main{z-index:10}
.deck{position:absolute;inset:0;z-index:12;overflow-y:auto;overflow-x:hidden;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;
  display:flex;flex-direction:column;justify-content:flex-end;
  padding:8% 5.5% 5%}
.deck::-webkit-scrollbar{display:none}

.rise{opacity:0;transform:translate3d(0,26px,0);
  transition:opacity .8s var(--ease),transform .9s var(--ease)}
#main.on .rise{opacity:1;transform:none}
#main.on .r1{transition-delay:.10s}#main.on .r2{transition-delay:.22s}
#main.on .r3{transition-delay:.34s}#main.on .r4{transition-delay:.46s}
#main.on .r5{transition-delay:.58s}

/* başlık bloğu — arka planı kapatmayan yumuşak katman */
.hero{text-align:center;margin-bottom:3.4%}
.eyebrow{display:inline-block;font-size:clamp(10px,2.9vw,12px);font-weight:700;
  letter-spacing:.26em;text-transform:uppercase;color:#fff;
  background:linear-gradient(135deg,var(--pink),var(--grape));
  padding:7px 15px;border-radius:999px;margin-bottom:3.2%;
  box-shadow:0 6px 16px rgba(180,70,130,.32)}
/* ─ gösterişli isim ─ */
.name{position:relative;display:block;font-family:'Kutlama',system-ui;font-weight:600;
  font-size:clamp(46px,14.5vw,76px);line-height:1;letter-spacing:.005em;margin:1.2% 0 0}
.name span{position:relative;z-index:2;
  background:linear-gradient(178deg,#FFF6DA 4%,#FFD86B 38%,#FFAF3A 62%,#FF8FB8 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 2px 0 rgba(255,255,255,.55))}
.name::before{content:attr(data-t);position:absolute;inset:0;z-index:1;
  color:#fff;-webkit-text-stroke:.19em #fff;text-stroke:.19em #fff;
  text-shadow:0 5px 0 rgba(78,154,46,.5),0 9px 26px rgba(12,44,20,.55),0 2px 3px rgba(0,0,0,.3)}
/* ışık süzülmesi */
.name::after{content:'';position:absolute;inset:-6% -14%;z-index:3;pointer-events:none;
  background:linear-gradient(102deg,transparent 38%,rgba(255,255,255,.72) 48%,transparent 58%);
  -webkit-mask-image:linear-gradient(#000,#000);mask-image:linear-gradient(#000,#000);
  transform:translateX(-120%);animation:shine 5.6s ease-in-out 1.2s infinite}
@keyframes shine{0%{transform:translateX(-120%)}26%,100%{transform:translateX(120%)}}

.age{display:inline-flex;align-items:center;gap:9px;margin-top:2.4%;
  padding:7px 18px;border-radius:999px;
  background:linear-gradient(150deg,rgba(255,255,255,.96),rgba(255,238,246,.9));
  border:1.5px solid rgba(255,255,255,.95);
  box-shadow:0 10px 24px -10px rgba(28,60,30,.5),0 2px 0 rgba(255,255,255,.7) inset}
.age b{font-family:'Kutlama',system-ui;font-weight:600;font-size:clamp(17px,4.8vw,22px);
  line-height:1;background:linear-gradient(160deg,var(--pink),var(--pink-deep));
  -webkit-background-clip:text;background-clip:text;color:transparent}
.age i{font-style:normal;font-size:clamp(11px,3vw,13px);color:var(--sun-deep);
  animation:twinkle 2.6s ease-in-out infinite}
.age i:last-child{animation-delay:1.3s}
@keyframes twinkle{0%,100%{opacity:.45;transform:scale(.86)}50%{opacity:1;transform:scale(1.15)}}

/* ─ mekân ─ */
.venue{display:flex;align-items:center;gap:11px;margin-top:3%;
  background:linear-gradient(168deg,rgba(255,253,246,.94),rgba(255,244,226,.9));
  border:1.5px solid rgba(255,255,255,.9);border-radius:18px;padding:3.6% 4.4%;
  box-shadow:0 12px 28px -14px rgba(28,60,30,.4)}
.venue .pin{font-size:clamp(17px,4.6vw,21px);line-height:1;flex:0 0 auto}
.venue .tx{min-width:0}
.venue b{display:block;font-family:'Kutlama',system-ui;font-weight:600;
  font-size:clamp(14px,4vw,17px);color:var(--ink);line-height:1.2}
.venue small{display:block;font-size:clamp(11.5px,3.2vw,13px);color:var(--ink-soft);
  line-height:1.4;margin-top:2px}

/* içerik kartları */
.card{background:linear-gradient(168deg,rgba(255,253,246,.94),rgba(255,244,226,.9));
  border:1.5px solid rgba(255,255,255,.9);border-radius:22px;
  box-shadow:0 14px 34px -14px rgba(28,60,30,.42),0 2px 0 rgba(255,255,255,.7) inset;
  padding:5.4% 5.6%}
.msg{font-size:clamp(13.5px,3.7vw,16px);line-height:1.62;color:var(--ink);text-align:center}

.when{display:flex;gap:3%;margin-top:3.4%}
.when .box{flex:1;background:linear-gradient(168deg,rgba(255,253,246,.94),rgba(255,244,226,.9));
  border:1.5px solid rgba(255,255,255,.9);border-radius:18px;padding:3.6% 3%;
  text-align:center;box-shadow:0 12px 28px -14px rgba(28,60,30,.4)}
.when .k{font-size:clamp(9.5px,2.7vw,11px);font-weight:700;letter-spacing:.16em;
  text-transform:uppercase;color:var(--pink-deep);margin-bottom:4px}
.when .v{font-family:'Kutlama',system-ui;font-weight:600;
  font-size:clamp(14px,4vw,17px);color:var(--ink);line-height:1.2}

/* geri sayım */
.cd{margin-top:3.4%;overflow:hidden;transition:max-height .5s var(--ease),opacity .4s ease,margin .4s ease;
  max-height:280px;opacity:1}
.cd.hide{max-height:0;opacity:0;margin-top:0}
.cd .inner{background:linear-gradient(168deg,rgba(255,253,246,.94),rgba(255,244,226,.9));
  border:1.5px solid rgba(255,255,255,.9);border-radius:22px;padding:4.6% 4%;
  box-shadow:0 14px 34px -14px rgba(28,60,30,.42)}
.cd .ttl{text-align:center;font-size:clamp(10px,2.8vw,11.5px);font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;color:var(--pink-deep);margin-bottom:3.4%}
.cd .row{display:flex;justify-content:center;gap:2.6%}
.cd .u{flex:1;max-width:23%;text-align:center;padding:3% 0;border-radius:14px;
  background:linear-gradient(170deg,rgba(255,255,255,.92),rgba(255,236,246,.75));
  border:1px solid rgba(255,255,255,.95)}
.cd .u b{display:block;font-family:'Kutlama',system-ui;font-weight:600;
  font-size:clamp(20px,6.2vw,27px);line-height:1;color:var(--pink-deep);
  font-variant-numeric:tabular-nums}
.cd .u span{display:block;font-size:clamp(8.5px,2.4vw,10px);font-weight:700;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft);margin-top:5px}

/* butonlar */
.acts{display:flex;gap:2.6%;margin-top:3.6%}
.act{flex:1;font:inherit;cursor:pointer;border:0;border-radius:18px;
  padding:4% 2%;display:flex;flex-direction:column;align-items:center;gap:5px;
  color:#fff;font-weight:700;font-size:clamp(11px,3vw,13px);letter-spacing:.01em;
  box-shadow:0 12px 26px -12px rgba(20,50,30,.5),0 2px 0 rgba(255,255,255,.35) inset;
  transition:transform .18s var(--ease),filter .18s ease}
.act em{font-style:normal;font-size:clamp(16px,4.6vw,20px);line-height:1}
.act:active{transform:scale(.96)}
.act:hover{filter:brightness(1.06)}
.act:focus-visible{outline:3px solid #fff;outline-offset:2px}
.a-cd{background:linear-gradient(150deg,var(--sun),var(--sun-deep))}
.a-map{background:linear-gradient(150deg,#6FD07A,var(--grass-deep))}
.a-rsvp{background:linear-gradient(150deg,var(--pink),var(--pink-deep))}

.foot{text-align:center;margin-top:3.4%;font-size:clamp(10.5px,2.9vw,12px);
  color:#fff;font-weight:700;letter-spacing:.04em;
  text-shadow:0 2px 10px rgba(10,40,20,.6)}

/* ═══ RSVP sayfası ═══ */
.sheet{position:fixed;inset:0;z-index:60;display:grid;place-items:center;padding:22px;
  background:rgba(18,36,26,.86);opacity:0;visibility:hidden;
  transition:opacity .34s var(--ease),visibility .34s}
.sheet.on{opacity:1;visibility:visible}
.sheet .box{width:100%;max-width:330px;background:linear-gradient(168deg,#fffdf6,#fff2e0);
  border-radius:24px;padding:26px 22px 20px;text-align:center;
  border:1.5px solid rgba(255,255,255,.95);box-shadow:0 26px 60px rgba(10,30,16,.5);
  transform:translateY(16px) scale(.97);transition:transform .4s var(--ease)}
.sheet.on .box{transform:none}
.sheet h3{font-family:'Kutlama',system-ui;font-weight:600;font-size:21px;color:var(--pink-deep);margin-bottom:6px}
.sheet p{font-size:13px;line-height:1.6;color:var(--ink-soft);margin-bottom:16px}
.sheet input{width:100%;font:inherit;font-size:15px;padding:12px 14px;margin-bottom:14px;
  text-align:center;border:1.5px solid rgba(232,85,140,.35);border-radius:14px;
  background:#fff;color:var(--ink)}
.sheet input:focus{outline:none;border-color:var(--pink-deep);box-shadow:0 0 0 3px rgba(232,85,140,.16)}
.pair{display:flex;gap:10px}
.btn{flex:1;font:inherit;font-weight:700;font-size:14px;padding:12px 10px;border-radius:14px;
  cursor:pointer;border:1.5px solid transparent;transition:transform .18s var(--ease),filter .18s}
.btn:active{transform:scale(.97)}
.btn-go{background:linear-gradient(150deg,var(--pink),var(--pink-deep));color:#fff}
.btn-x{background:#fff;border-color:rgba(107,122,92,.3);color:var(--ink-soft)}
.pick{display:flex;gap:10px;margin-bottom:14px}
.pick button{flex:1;font:inherit;font-weight:700;font-size:13px;padding:11px 8px;border-radius:14px;
  cursor:pointer;border:1.5px solid rgba(107,122,92,.28);background:#fff;color:var(--ink-soft);
  transition:all .18s var(--ease)}
.pick button.sel{background:linear-gradient(150deg,var(--pink),var(--pink-deep));color:#fff;border-color:transparent}

.toast{position:fixed;left:50%;bottom:9%;z-index:70;transform:translate(-50%,14px);
  padding:11px 20px;border-radius:999px;background:#fffdf6;color:var(--ink);
  font-size:13.5px;font-weight:700;white-space:nowrap;box-shadow:0 12px 34px rgba(10,30,16,.45);
  opacity:0;pointer-events:none;transition:opacity .3s ease,transform .3s var(--ease)}
.toast.on{opacity:1;transform:translate(-50%,0)}

@media(prefers-reduced-motion:reduce){
  #bg{animation:none} #confetti{display:none}
  .rise{transition-duration:.25s!important} .tap b{animation:none}
  .name::after,.age i{animation:none} .name::after{display:none}
}
</style>
</head>
<body>
<div class="frame"><div class="stage" id="stage">

  <!-- 3. REFERANS · ana arka plan (birebir) -->
  <div id="bg"></div>
  <canvas id="confetti"></canvas>

  <!-- ═══ ANA DAVETİYE ═══ -->
  <section class="screen" id="main" aria-hidden="true">
    <div class="deck">
      <div class="hero rise r1">
        <span class="eyebrow">Doğum Günü Daveti</span>
        <h1 class="name" id="h1" data-t="Deniz"><span>Deniz</span></h1>
        <div class="age" id="age"><i>✦</i><b>3 Yaşında!</b><i>✦</i></div>
      </div>

      <div class="card rise r2"><p class="msg" id="msg"></p></div>

      <div class="when rise r3">
        <div class="box"><div class="k">Tarih</div><div class="v" id="tarih">—</div></div>
        <div class="box"><div class="k">Saat</div><div class="v" id="saat">—</div></div>
      </div>

      <div class="venue rise r3" id="venue">
        <span class="pin">📍</span>
        <span class="tx"><b id="mekan">—</b><small id="adres">—</small></span>
      </div>

      <div class="cd rise r4" id="cdWrap">
        <div class="inner">
          <div class="ttl">Kutlamaya Kalan</div>
          <div class="row">
            <div class="u"><b data-cd="d">00</b><span>Gün</span></div>
            <div class="u"><b data-cd="h">00</b><span>Saat</span></div>
            <div class="u"><b data-cd="m">00</b><span>Dakika</span></div>
            <div class="u"><b data-cd="s">00</b><span>Saniye</span></div>
          </div>
        </div>
      </div>

      <div class="acts rise r5">
        <button class="act a-cd"   id="btnCd"   type="button"><em>⏳</em>Geri Sayım</button>
        <button class="act a-map"  id="btnMap"  type="button"><em>📍</em>Yol Tarifi</button>
        <button class="act a-rsvp" id="btnRsvp" type="button"><em>💌</em>Katılım</button>
      </div>

      <p class="foot rise r5" id="foot">Sizi aramızda görmek bizi çok mutlu eder 🎂</p>
    </div>
  </section>

  <!-- ═══ 2. REFERANS · giriş animasyonu ═══ -->
  <section class="screen" id="intro" aria-hidden="true">
    <video id="introVid" playsinline webkit-playsinline muted preload="auto"
           disablepictureinpicture disableremoteplayback></video>
  </section>

  <!-- ═══ 1. REFERANS · kapak animasyonu ═══ -->
  <section class="screen on" id="cover">
    <video id="coverVid" playsinline webkit-playsinline muted preload="auto"
           disablepictureinpicture disableremoteplayback></video>
  </section>

  <div class="tap" id="tap"><b>Dokun ve Aç 🎈</b></div>
  <button class="skip" id="skip" type="button">Atla</button>
</div></div>

<!-- RSVP -->
<div class="sheet" id="sheet" role="dialog" aria-modal="true">
  <div class="box">
    <h3>Katılım Bildir</h3>
    <p id="sheetText">Adını yaz ve durumunu seç, bilgin bize ulaşsın.</p>
    <div class="pick">
      <button id="pickYes" type="button" class="sel">Katılıyorum</button>
      <button id="pickNo"  type="button">Katılamıyorum</button>
    </div>
    <input id="guest" type="text" placeholder="Adınız" autocomplete="name" enterkeyhint="send">
    <div class="pair">
      <button class="btn btn-x"  id="cancel" type="button">Vazgeç</button>
      <button class="btn btn-go" id="send"   type="button">Gönder</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
const C=window.CONFIG,$=s=>document.querySelector(s);
const stage=$('#stage'),cover=$('#cover'),intro=$('#intro'),main=$('#main'),
      cv=$('#coverVid'),iv=$('#introVid'),tap=$('#tap'),skip=$('#skip');

/* ── içerik ── */
$('#h1').setAttribute('data-t',C.cocuk);
$('#h1').querySelector('span').textContent=C.cocuk;
$('#age b').textContent=C.yas+' Yaşında!';
$('#msg').textContent=C.mesaj;
$('#tarih').textContent=C.tarihYazi;
$('#saat').textContent=C.saatYazi;
$('#mekan').textContent=C.mekan;
$('#adres').textContent=C.adres;
document.title=C.cocuk+' '+C.yas+' Yaşında · Doğum Günü Daveti';

/* ── güvenilir link açma ── */
function openUrl(u){try{const a=document.createElement('a');a.href=u;a.target='_blank';
  a.rel='noopener noreferrer';document.body.appendChild(a);a.click();a.remove();}
  catch(e){try{if(!window.open(u,'_blank'))location.href=u;}catch(_){location.href=u;}}}

/* ══ AKIŞ: kapak → giriş → davetiye ══ */
let stage2=false,done=false;
cv.src='assets/kapak.mp4'; cv.load();
iv.src='assets/giris.mp4'; iv.load();

function showMain(){
  if(done) return; done=true;
  main.classList.add('on'); main.setAttribute('aria-hidden','false');
  skip.classList.remove('on');
  setTimeout(()=>{ intro.classList.remove('on'); cover.classList.remove('on');
    try{cv.pause();iv.pause();}catch(e){} },900);
}
function playIntro(){
  if(stage2||done) return; stage2=true;
  const go=()=>{ intro.classList.add('on'); setTimeout(()=>cover.classList.remove('on'),260); };
  if(iv.readyState>=2) go(); else iv.addEventListener('loadeddata',go,{once:true});
  iv.addEventListener('playing',go,{once:true});
  const p=iv.play(); if(p&&p.catch) p.catch(showMain);
  iv.addEventListener('ended',showMain,{once:true});
  iv.addEventListener('error',showMain,{once:true});
  setTimeout(go,700);
  setTimeout(showMain,12000);            /* emniyet */
}
cv.addEventListener('ended',playIntro,{once:true});
cv.addEventListener('error',playIntro,{once:true});
cv.addEventListener('timeupdate',function t(){ if(stage2){cv.removeEventListener('timeupdate',t);return;}
  if(cv.duration&&isFinite(cv.duration)&&cv.currentTime>=cv.duration-0.12) playIntro(); });

function startCover(){
  tap.classList.remove('on');
  const p=cv.play();
  if(p&&p.catch) p.catch(()=>tap.classList.add('on'));
  setTimeout(()=>skip.classList.add('on'),1400);
}
tap.addEventListener('click',startCover);
tap.addEventListener('touchend',e=>{e.preventDefault();startCover();},{passive:false});
skip.addEventListener('click',showMain);
if(cv.readyState>=2) startCover(); else cv.addEventListener('loadeddata',startCover,{once:true});
setTimeout(()=>{ if(!stage2&&!done&&cv.paused) tap.classList.add('on'); },1200);
setTimeout(()=>{ if(!done) showMain(); },20000);   /* son emniyet */

/* ══ canlı geri sayım ══ */
const cd={d:$('[data-cd="d"]'),h:$('[data-cd="h"]'),m:$('[data-cd="m"]'),s:$('[data-cd="s"]')};
const hedef=new Date(C.tarihISO).getTime(),pad=n=>String(n).padStart(2,'0');
(function tick(){ let df=Math.max(0,hedef-Date.now()); const s=Math.floor(df/1000);
  cd.d.textContent=pad(Math.floor(s/86400)); cd.h.textContent=pad(Math.floor(s%86400/3600));
  cd.m.textContent=pad(Math.floor(s%3600/60)); cd.s.textContent=pad(s%60);
  setTimeout(tick,1000); })();

/* ══ butonlar ══ */
$('#btnCd').addEventListener('click',()=>{
  const w=$('#cdWrap'); w.classList.toggle('hide');
  if(!w.classList.contains('hide')) w.scrollIntoView({behavior:'smooth',block:'nearest'});
});
function acHarita(){
  const q=(C.mekan+' '+C.adres).replace(/\s*·\s*/g,' ').replace(/\s+/g,' ').trim();
  openUrl(C.haritaURL||('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q)));
}
$('#btnMap').addEventListener('click',acHarita);
$('#venue').addEventListener('click',acHarita);
$('#venue').style.cursor='pointer';

/* ══ RSVP ══ */
const sheet=$('#sheet'); let ans='yes',tT,confettiPaused=false;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');
  clearTimeout(tT);tT=setTimeout(()=>t.classList.remove('on'),2600);}
function openSheet(){sheet.classList.add('on');confettiPaused=true;
  setTimeout(()=>$('#guest').focus(),360);}
function closeSheet(){sheet.classList.remove('on');confettiPaused=false;}
function pick(v){ans=v;$('#pickYes').classList.toggle('sel',v==='yes');
  $('#pickNo').classList.toggle('sel',v==='no');}
$('#btnRsvp').addEventListener('click',openSheet);
$('#pickYes').addEventListener('click',()=>pick('yes'));
$('#pickNo').addEventListener('click',()=>pick('no'));
$('#cancel').addEventListener('click',closeSheet);
$('#send').addEventListener('click',()=>{
  const ad=($('#guest').value||'').trim();
  const base=ans==='yes'?C.evetMesaj:C.hayirMesaj;
  openUrl('https://wa.me/'+C.whatsapp+'?text='+encodeURIComponent(ad?base+'\n— '+ad:base));
  closeSheet(); toast(ans==='yes'?'Teşekkürler, sizi bekliyoruz 🎈':'Bilginiz iletildi, teşekkürler');
});
$('#guest').addEventListener('keydown',e=>{if(e.key==='Enter')$('#send').click();});
sheet.addEventListener('click',e=>{if(e.target===sheet)closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

/* ══ konfeti — sürekli, zarif ══ */
const cc=$('#confetti'),ctx=cc.getContext('2d');
const PAL=['#FF8FB8','#FFC93C','#B98CE8','#7BC043','#5BB6E8','#FF7B6B','#FFFFFF'];
let W,H,DPR,bits;
function size(){DPR=Math.min(devicePixelRatio||1,2);W=cc.clientWidth;H=cc.clientHeight;
  cc.width=W*DPR;cc.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
  const n=Math.round(W*H/26000);
  bits=Array.from({length:Math.max(14,Math.min(34,n))},mk);}
function mk(){const r=Math.random();
  return{x:Math.random()*W,y:Math.random()*H,
    w:4+Math.random()*6,h:6+Math.random()*8,
    vy:(11+Math.random()*20)/60,vx:(Math.random()-.5)*.28,
    rot:Math.random()*6.28,vr:(Math.random()-.5)*.055,
    c:PAL[(Math.random()*PAL.length)|0],a:.5+Math.random()*.45,
    sw:Math.random()*6.28,ss:.5+Math.random()*1.1,ribbon:r<.34};}
function draw(t){requestAnimationFrame(draw); if(confettiPaused)return;
  ctx.clearRect(0,0,W,H);
  for(const b of bits){
    b.y+=b.vy; b.x+=b.vx+Math.sin(t/900*b.ss+b.sw)*.32; b.rot+=b.vr;
    if(b.y>H+14){Object.assign(b,mk());b.y=-14;}
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.rot);
    ctx.globalAlpha=b.a;ctx.fillStyle=b.c;
    if(b.ribbon){ctx.beginPath();
      ctx.ellipse(0,0,b.w*.5,b.h*.62,0,0,6.283);ctx.fill();}
    else{const sq=Math.abs(Math.cos(t/700*b.ss+b.sw));
      ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h*(.35+.65*sq));}
    ctx.restore();
  }}
size();addEventListener('resize',size,{passive:true});requestAnimationFrame(draw);
})();
</script>
</body>
</html>
